<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="CBSE Board Exam Crash Course">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#16276b"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#3b61ea" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b61ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="280" fill="url(#bg3)"/>
  <rect width="800" height="280" fill="url(#glow3)"/>
  <rect width="800" height="280" fill="url(#grid3)"/>

  <!-- answer sheet -->
  <g transform="translate(560,168) rotate(-4)">
    <rect x="-92" y="-74" width="184" height="148" rx="10" fill="#ffffff"/>
    <rect x="-92" y="-74" width="184" height="34" rx="10" fill="#e8edfb"/>
    <rect x="-74" y="-58" width="76" height="9" rx="4.5" fill="#1e40af" fill-opacity="0.75"/>
    <g stroke="#c9d4f2" stroke-width="7" stroke-linecap="round">
      <line x1="-46" y1="-14" x2="74" y2="-14"/>
      <line x1="-46" y1="16" x2="74" y2="16"/>
      <line x1="-46" y1="46" x2="42" y2="46"/>
    </g>
    <g fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-74 -20 l7 8 l13 -15"/>
      <path d="M-74 10 l7 8 l13 -15"/>
      <path d="M-74 40 l7 8 l13 -15"/>
    </g>
    <!-- A+ score bubble -->
    <g transform="translate(84,-66)">
      <circle r="26" fill="#D4AF37"/>
      <text y="8" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="22" fill="#16276b">A+</text>
    </g>
  </g>

  <!-- stopwatch -->
  <g transform="translate(338,148) scale(0.85)">
    <line x1="0" y1="-64" x2="0" y2="-76" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="-16" y1="-76" x2="16" y2="-76" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="46" y1="-52" x2="56" y2="-62" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle r="62" fill="#0b1220" stroke="#ffffff" stroke-width="5"/>
    <circle r="50" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- ticks -->
    <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="-40"/>
      <line x1="50" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="50" x2="0" y2="40"/>
      <line x1="-50" y1="0" x2="-40" y2="0"/>
    </g>
    <!-- gold countdown arc: last quarter -->
    <path d="M0 -50 A 50 50 0 0 1 50 0" fill="none" stroke="#D4AF37" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="-30" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#D4AF37"/>
  </g>

  <!-- lightning bolt -->
  <path d="M429 60 L403 118 L425 118 L411 168 L453 104 L429 104 L447 60 Z" fill="#D4AF37" opacity="0.95"/>

  <!-- floating marks -->
  <g fill="#ffffff" fill-opacity="0.22" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="112" y="72" font-size="20">100/100</text>
    <text x="150" y="240" font-size="22">&#10003;</text>
    <text x="448" y="242" font-size="20">Q.29</text>
  </g>

  <!-- badge -->
  <g transform="translate(112,150)">
    <rect x="0" y="-26" rx="14" width="170" height="30" fill="#0b1220" fill-opacity="0.55" stroke="#D4AF37" stroke-opacity="0.65"/>
    <text x="85" y="-5" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">CLASS 10 &amp; 12</text>
    <rect x="0" y="16" width="64" height="4" rx="2" fill="#D4AF37"/>
  </g>
</svg>
