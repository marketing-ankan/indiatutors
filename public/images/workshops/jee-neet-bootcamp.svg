<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="JEE / NEET Foundation Bootcamp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16276b"/>
      <stop offset="0.55" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#1c3a9c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#6086f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6086f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="280" fill="url(#bg)"/>
  <rect width="800" height="280" fill="url(#glow)"/>
  <rect width="800" height="280" fill="url(#grid)"/>

  <!-- faint floating formulas -->
  <g fill="#ffffff" fill-opacity="0.22" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="112" y="70" font-size="22">E = mc&#178;</text>
    <text x="620" y="230" font-size="20">F = ma</text>
    <text x="672" y="80" font-size="30">&#8747;</text>
    <text x="560" y="60" font-size="20">&#916;v</text>
    <text x="120" y="235" font-size="24">&#955;</text>
  </g>

  <!-- hexagon (chemistry) -->
  <g transform="translate(660,160)" stroke="#ffffff" stroke-opacity="0.28" fill="none" stroke-width="2">
    <path d="M0 -34 L29 -17 L29 17 L0 34 L-29 17 L-29 -17 Z"/>
    <path d="M0 -18 L15 -9 L15 9 L0 18 L-15 9 L-15 -9 Z" stroke-opacity="0.16"/>
  </g>

  <!-- atom -->
  <g transform="translate(300,140)">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5">
      <ellipse rx="86" ry="32"/>
      <ellipse rx="86" ry="32" transform="rotate(60)"/>
      <ellipse rx="86" ry="32" transform="rotate(-60)"/>
    </g>
    <circle r="11" fill="#D4AF37"/>
    <circle r="11" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="86" cy="0" r="5.5" fill="#D4AF37"/>
    <circle cx="-43" cy="-64" r="5.5" fill="#ffffff"/>
    <circle cx="-43" cy="64" r="5.5" fill="#ffffff"/>
  </g>

  <!-- rocket + trajectory -->
  <g transform="translate(490,175)">
    <path d="M-120 68 Q -30 60 8 6" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" stroke-opacity="0.9"/>
    <g transform="rotate(42)">
      <path d="M0 -46 C 10 -30 13 -12 13 6 L -13 6 C -13 -12 -10 -30 0 -46 Z" fill="#ffffff"/>
      <path d="M0 -46 C 4 -30 5 -12 5 6 L -5 6 C -5 -12 -4 -30 0 -46 Z" fill="#e8edfb"/>
      <circle cx="0" cy="-14" r="6" fill="#1e40af"/>
      <circle cx="0" cy="-14" r="3" fill="#6086f5"/>
      <path d="M-13 -2 L -24 16 L -13 12 Z" fill="#D4AF37"/>
      <path d="M13 -2 L 24 16 L 13 12 Z" fill="#D4AF37"/>
      <path d="M-6 6 L 0 24 L 6 6 Z" fill="#D4AF37"/>
      <path d="M-3 6 L 0 15 L 3 6 Z" fill="#f6e27a"/>
    </g>
  </g>

  <!-- badge -->
  <g transform="translate(112,150)">
    <rect x="0" y="-26" rx="14" width="150" height="30" fill="#0b1220" fill-opacity="0.55" stroke="#D4AF37" stroke-opacity="0.65"/>
    <text x="75" y="-5" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2">JEE &#8226; NEET</text>
    <rect x="0" y="16" width="64" height="4" rx="2" fill="#D4AF37"/>
  </g>
</svg>
